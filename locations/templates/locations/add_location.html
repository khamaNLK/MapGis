{% extends 'locations/base.html' %}
{% block extra_css %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .full-height { height: calc(100vh - 56px); }
        .sidebar-scroll { overflow-y: auto; height: 100%; background: white; }
        #map { height: 100%; width: 100%; z-index: 1; }
        .search-tool { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .form-control[readonly] { background-color: #e9ecef; cursor: not-allowed; font-weight: bold; color: #198754; }
        .preview-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ddd; }
    </style>
{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="row g-0 full-height">
        <div class="col-md-4 col-lg-4 sidebar-scroll p-4 shadow-sm" style="z-index: 2;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="text-primary m-0"><i class="fa-solid {% if is_edit %}fa-pen-to-square{% else %}fa-map-location-dot{% endif %}"></i> {% if is_edit %}Sửa{% else %}Thêm{% endif %} Địa Điểm</h4>
                <a href="{% url 'custom_dashboard' %}" class="btn btn-sm btn-outline-secondary rounded-pill fw-bold">Trở về</a>
            </div>

            <div class="search-tool shadow-sm">
                <label class="form-label fw-bold small text-muted">Tìm khu vực nhanh:</label>
                <div class="input-group">
                    <input type="text" id="search-input" class="form-control" placeholder="VD: Chợ Bến Thành...">
                    <button class="btn btn-primary" type="button" onclick="searchLocation()"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-2 mb-3">
                    <div class="col-5">
                        <label class="small fw-bold">Vĩ độ (Lat)</label>
                        <input type="text" id="lat" name="lat" class="form-control form-control-sm" readonly required value="{{ form.lat.value|default:'' }}">
                    </div>
                    <div class="col-5">
                        <label class="small fw-bold">Kinh độ (Lng)</label>
                        <input type="text" id="lng" name="lon" class="form-control form-control-sm" readonly required value="{{ form.lon.value|default:'' }}">
                    </div>
                    <div class="col-2 d-flex align-items-end">
                        <button type="button" class="btn btn-sm btn-outline-primary w-100" onclick="locateMe()" title="Định vị">
                            <i class="fa-solid fa-location-crosshairs"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Địa chỉ thực tế</label>
                    <textarea name="address" id="real-address" class="form-control" rows="2" readonly required placeholder="Click map để lấy địa chỉ...">{% if is_edit %}{{ location.address }}{% endif %}</textarea>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Tên địa điểm *</label>
                    <input type="text" name="name" class="form-control" required value="{% if is_edit %}{{ location.name }}{% endif %}" placeholder="Nhập tên quán...">
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Danh mục địa điểm *</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-layer-group"></i></span>
                        <select name="category_name" class="form-select" required>
                            <option value="" selected disabled>-- Chọn danh mục --</option>
                            <option value="Quán ăn" {% if is_edit and location.category.name == "Quán ăn" %}selected{% endif %}>🍜 Quán ăn</option>
                            <option value="Cafe" {% if is_edit and location.category.name == "Cafe" %}selected{% endif %}>☕ Cafe</option>
                            <option value="Trạm xăng" {% if is_edit and location.category.name == "Trạm xăng" %}selected{% endif %}>⛽ Trạm xăng</option>
                            <option value="Khách sạn" {% if is_edit and location.category.name == "Khách sạn" %}selected{% endif %}>🏨 Khách sạn</option>
                            <option value="Giải trí" {% if is_edit and location.category.name == "Giải trí" %}selected{% endif %}>🎮 Giải trí</option>
                            <option value="Siêu thị" {% if is_edit and location.category.name == "Siêu thị" %}selected{% endif %}>🛒 Siêu thị</option>
                            <option value="Công viên" {% if is_edit and location.category.name == "Công viên" %}selected{% endif %}>🌳 Công viên</option>
                            <option value="Bệnh viện" {% if is_edit and location.category.name == "Bệnh viện" %}selected{% endif %}>🏥 Bệnh viện</option>
                            <option value="Trường học" {% if is_edit and location.category.name == "Trường học" %}selected{% endif %}>🏫 Trường học</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Mô tả</label>
                    <textarea name="description" class="form-control" rows="3">{% if is_edit %}{{ location.description }}{% endif %}</textarea>
                </div>

                <div class="mb-4">
                    <label class="fw-bold">Hình ảnh</label>
                    {% if is_edit and location.image %}
                        <img src="{{ location.image.url }}" class="preview-img">
                    {% endif %}
                    {{ form.image }}
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-pill shadow">
                    <i class="fa-solid fa-floppy-disk"></i> {% if is_edit %}Cập Nhật{% else %}Lưu Địa Điểm{% endif %}
                </button>
            </form>
        </div>

        <div class="col-md-8 col-lg-8 position-relative">
            <div id="map"></div>
            <div id="loading-overlay" style="display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(255,255,255,0.7); z-index:9999; align-items:center; justify-content:center;">
                <div class="spinner-border text-primary"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([10.762622, 106.660172], 14);
    L.tileLayer('http://mt0.google.com/vt/lyrs=y&hl=vi&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);
    
    var marker = null;

    function locateMe() {
        if (!navigator.geolocation) return alert("Không hỗ trợ định vị!");
        document.getElementById('loading-overlay').style.display = 'flex';
        navigator.geolocation.getCurrentPosition(function(pos) {
            document.getElementById('loading-overlay').style.display = 'none';
            var lat = pos.coords.latitude, lng = pos.coords.longitude;
            map.flyTo([lat, lng], 17);
            updateLocationFields(lat, lng);
        }, function() {
            document.getElementById('loading-overlay').style.display = 'none';
            alert("Lỗi GPS!");
        });
    }

    function updateLocationFields(lat, lng) {
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        document.getElementById('lat').value = lat.toFixed(6);
        document.getElementById('lng').value = lng.toFixed(6);
        
        document.getElementById('real-address').value = "⏳ Đang lấy địa chỉ...";
        fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`)
            .then(res => res.json()).then(data => {
                document.getElementById('real-address').value = data.display_name || "Không xác định";
            });
    }

    {% if is_edit and location %}
        var ilat = {{ location.geom.y|stringformat:"f" }}, ilng = {{ location.geom.x|stringformat:"f" }};
        map.setView([ilat, ilng], 17);
        updateLocationFields(ilat, ilng);
    {% endif %}

    window.searchLocation = function() {
        var q = document.getElementById('search-input').value;
        if (!q) return;
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`)
            .then(res => res.json()).then(data => {
                if (data.length > 0) map.flyTo([data[0].lat, data[0].lon], 16);
            });
    };

    map.on('click', function(e) {
        updateLocationFields(e.latlng.lat, e.latlng.lng);
    });
</script>
{% endblock %}
