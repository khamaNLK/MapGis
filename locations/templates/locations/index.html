{% extends 'locations/base.html' %}
{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
<style>
    #map { height: calc(100vh - 56px); width: 100%; z-index: 1; background: #1a1a1a; }
    .glass-panel { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15); border-radius: 20px; }
    .quick-search-bar { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 6px 12px; display: flex; gap: 6px; align-items: center; max-width: 90vw; overflow-x: auto; scrollbar-width: none; }
    .quick-search-bar::-webkit-scrollbar { display: none; }
    .btn-quick { flex-shrink: 0; border: none; background: white; padding: 6px 14px; border-radius: 40px; font-weight: 700; font-size: 0.75rem; color: #333; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 5px; }
    .btn-quick:hover { background: #f0f4ff; transform: translateY(-2px); color: #0d6efd; }
    .btn-quick.active-tool { background: #fd7e14 !important; color: white !important; }
    .radius-control { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 8px 18px; display: flex; align-items: center; gap: 10px; }
    #radius-input { width: 85px; text-align: center; font-weight: bold; border-radius: 8px; border: 1px solid #0d6efd; }
    #search-results-panel { position: absolute; top: 20px; left: 20px; z-index: 999; width: 340px; max-height: 85vh; overflow-y: auto; display: none; padding: 15px; }
    .friends-panel { position: absolute; top: 20px; right: 20px; z-index: 999; width: 260px; overflow: hidden; }
    .friend-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; }
    .avatar-marker { width: 45px; height: 45px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); object-fit: cover; }
    .marker-name-tag { background: rgba(0, 0, 0, 0.75); color: white; font-size: 10px; padding: 3px 10px; border-radius: 12px; white-space: nowrap; margin-top: 2px; font-weight: bold; text-align: center; }
    .btn-group-sm-custom { display: flex; gap: 5px; margin-top: 8px; }
    .route-btn { border: none; border-radius: 10px; padding: 8px 12px; background: #198754; color: #fff; font-weight: 700; flex-grow: 2; font-size: 0.8rem; }
    .detail-btn { border: 1px solid #0d6efd; border-radius: 10px; padding: 8px 12px; background: #fff; color: #0d6efd; font-weight: 700; flex-grow: 1; font-size: 0.8rem; text-decoration: none; text-align: center; }
    .detail-btn:hover { background: #0d6efd; color: #fff; }
    .locate-me-btn { position: absolute; bottom: 100px; left: 20px; z-index: 999; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; color: #0d6efd; border: none; }
    
    @media (max-width: 767.98px) {
        #map { height: calc(100vh - 65px); margin-top: -15px; }
        .leaflet-touch .leaflet-control-layers, .leaflet-touch .leaflet-bar { border: 2px solid rgba(0,0,0,0.2); }
    }
    .leaflet-popup-content-wrapper { border-radius: 15px; padding: 5px; }
    .star-rating { color: #ffc107; font-size: 14px; }
</style>
{% endblock %}

{% block content %}
<div class="quick-search-bar glass-panel shadow-sm">
    <button class="btn-quick" onclick="findNearestByCategory('Quán ăn')">🍜 Ăn uống</button>
    <button class="btn-quick" onclick="findNearestByCategory('Cafe')">☕ Cafe</button>
    <button class="btn-quick" onclick="findNearestByCategory('Trạm xăng')">⛽ Xăng</button>
    <button class="btn-quick" onclick="findNearestByCategory('Khách sạn')">🏨 Khách sạn</button>
    <button class="btn-quick" onclick="findNearestByCategory('')">📍 Tất cả</button>
    <button id="btn-picker" class="btn-quick" onclick="togglePickerMode()">🎯 Cắm mốc</button>
    <a href="{% url 'about' %}" class="btn-quick text-decoration-none text-dark">
        <i class="fa-solid fa-circle-info text-info"></i> Giới thiệu
    </a>
</div>

<!-- Đã bỏ giá trị mặc định để nó hiển thị Vô hạn ngay từ đầu -->
<div class="radius-control glass-panel shadow-sm">
    <label class="fw-bold extra-small m-0 text-dark">Bán kính:</label>
    <input type="number" id="radius-input" class="form-control form-control-sm" placeholder="Vô hạn" onchange="performSearch()">
    <span id="radius-status" class="badge bg-primary rounded-pill">Vô hạn</span>
</div>

<div id="search-results-panel" class="glass-panel shadow-lg">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold m-0" id="search-title">Kết quả</h6>
        <button class="btn-close btn-sm" onclick="document.getElementById('search-results-panel').style.display='none'"></button>
    </div>
    <div id="search-results-content"></div>
</div>

<!-- Bottom Navigation cho Mobile -->
<nav class="navbar fixed-bottom navbar-light bg-white border-top d-md-none p-0 shadow-lg">
    <div class="d-flex w-100 justify-content-around py-2">
        <a href="{% url 'map_home' %}" class="text-center text-decoration-none text-primary fw-bold flex-grow-1"><i class="fa-solid fa-map-location-dot fs-4"></i><br><small>Bản đồ</small></a>
        <a href="{% url 'find_friends' %}" class="text-center text-decoration-none text-muted flex-grow-1"><i class="fa-solid fa-user-group fs-4"></i><br><small>Bạn bè</small></a>
        <a href="{% url 'add_location' %}" class="text-center text-decoration-none text-primary flex-grow-1">
            <div class="bg-primary text-white rounded-circle shadow d-inline-flex align-items-center justify-content-center" style="width: 45px; height: 45px; margin-top: -20px; border: 3px solid white;"><i class="fa-solid fa-plus fs-5"></i></div>
        </a>
        <a href="{% url 'custom_dashboard' %}" class="text-center text-decoration-none text-muted flex-grow-1"><i class="fa-solid fa-list-check fs-4"></i><br><small>Quản lý</small></a>
    </div>
</nav>

<button class="locate-me-btn glass-panel shadow" onclick="moveToMyLocation()"><i class="fa-solid fa-location-crosshairs"></i></button>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
<script>
    var map = L.map('map', { zoomControl: false }).setView([10.762622, 106.660172], 14);
    L.tileLayer('http://mt1.google.com/vt/lyrs=m&hl=vi&x={x}&y={y}&z={z}').addTo(map);
    var data = {{ locations_json|safe }};
    var myLat = null, myLng = null, searchCircle = null, pickerMarker = null, routingControl = null;
    var currentUserName = "{{ user.username|default:'Tôi' }}";
    
    // Cập nhật số lượng hiển thị mỗi trang thành 5
    let searchCache = [], currentCat = "", itemsPerPage = 5, isInfinite = true, isPicker = false;

    // Định vị
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(pos => {
            myLat = pos.coords.latitude;
            myLng = pos.coords.longitude;
            fetch('/api/update_location/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
                body: JSON.stringify({ lat: myLat, lng: myLng })
            });
        }, null, { enableHighAccuracy: true });
    }
    window.moveToMyLocation = () => { if(myLat) map.flyTo([myLat, myLng], 17); };

    // Công cụ Picker
    window.togglePickerMode = () => {
        isPicker = !isPicker;
        document.getElementById('btn-picker').classList.toggle('active-tool', isPicker);
        map.getContainer().style.cursor = isPicker ? 'crosshair' : '';
    };

    map.on('click', e => {
        if (isPicker) {
            if (pickerMarker) map.removeLayer(pickerMarker);
            pickerMarker = L.marker(e.latlng, { icon: L.divIcon({ html: '🎯', className: 'fs-3', iconAnchor: [15, 15] }) }).addTo(map);
            performSearch(e.latlng);
        }
    });

    window.findNearestByCategory = (cat) => { currentCat = cat; performSearch(); };
    window.setInfiniteRadius = () => { document.getElementById('radius-input').value = ""; performSearch(); };

    function performSearch(customCenter = null) {
        const inputVal = document.getElementById('radius-input').value;
        let radiusLimit = inputVal ? parseInt(inputVal) : 9999999;
        isInfinite = !inputVal;
        let center = customCenter || L.latLng(myLat || map.getCenter().lat, myLng || map.getCenter().lng);
        document.getElementById('radius-status').innerText = isInfinite ? "Vô hạn" : (radiusLimit/1000).toFixed(1) + "km";
        
        if (searchCircle) map.removeLayer(searchCircle);
        searchCache = data.features.filter(f => {
            let dist = center.distanceTo(L.latLng(f.geometry.coordinates[1], f.geometry.coordinates[0]));
            f.dist = dist;
            return (f.properties.category || "").toLowerCase().includes(currentCat.toLowerCase()) && (isInfinite || dist <= radiusLimit);
        }).sort((a, b) => a.dist - b.dist);

        if (!isInfinite) {
            searchCircle = L.circle(center, { radius: radiusLimit, color: '#0d6efd', fillOpacity: 0.1, weight: 1 }).addTo(map);
            map.fitBounds(searchCircle.getBounds(), { padding: [30, 30] });
        }
        renderSearchResults(1);
    }

    function renderSearchResults(page) {
        const container = document.getElementById('search-results-content');
        document.getElementById('search-results-panel').style.display = 'block';
        document.getElementById('search-title').innerText = `Kết quả: ${currentCat || 'Tất cả'} (${searchCache.length})`;
        
        const start = (page - 1) * itemsPerPage;
        const paged = searchCache.slice(start, start + itemsPerPage);
        
        // Tính toán tổng số trang
        const totalPages = Math.ceil(searchCache.length / itemsPerPage);
        
        let html = '';
        paged.forEach(f => {
            let p = f.properties;
            let imgUrl = p.image_url || 'https://via.placeholder.com/150';
            html += `
            <div class="card mb-3 border-0 shadow-sm rounded-4 overflow-hidden">
                <img src="${imgUrl}" class="w-100" style="height:110px; object-fit:cover;">
                <div class="card-body p-2" onclick="map.flyTo([${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}], 18)">
                    <h6 class="fw-bold m-0">${p.name}</h6>
                    <div class="small text-warning">${'★'.repeat(Math.round(p.avg_rating))}${'☆'.repeat(5-Math.round(p.avg_rating))} (${p.avg_rating})</div>
                    <div class="small text-muted"><i class="fa-regular fa-clock"></i> ${p.open_time} - ${p.close_time}</div>
                    <small class="text-danger fw-bold d-block">📍 ${(f.dist / 1000).toFixed(2)} km</small>
                    <a href="/location/${p.pk}/" class="btn btn-primary btn-sm w-100 mt-2 rounded-pill">Chi tiết</a>
                </div>
            </div>`;
        });
        
        // Thêm UI phân trang nếu có nhiều hơn 1 trang
        if (totalPages > 1) {
            html += `<div class="d-flex justify-content-center flex-wrap gap-1 mt-3 mb-2">`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-outline-primary'} rounded-circle fw-bold" style="width: 32px; height: 32px; padding: 0;" onclick="renderSearchResults(${i})">${i}</button>`;
            }
            html += `</div>`;
        }

        container.innerHTML = html || '<p class="text-center text-muted">Không có địa điểm nào.</p>';
        
        // Cuộn lên đầu panel kết quả mỗi khi chuyển trang
        document.getElementById('search-results-panel').scrollTop = 0;
    }

    // Hiển thị Marker trên bản đồ
    function getEmoji(cat) {
        let c = (cat || "").toLowerCase();
        if (c.includes("ăn")) return "🍜"; if (c.includes("cafe")) return "☕";
        if (c.includes("xăng")) return "⛽"; if (c.includes("khách sạn")) return "🏨";
        return "📍";
    }

    L.geoJSON(data, {
        pointToLayer: (f, latlng) => L.marker(latlng, {
            icon: L.divIcon({ html: `<div style="background:white; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border:2px solid #0d6efd; box-shadow:0 2px 8px rgba(0,0,0,0.2)">${getEmoji(f.properties.category)}</div>`, iconSize: [32, 32], iconAnchor: [16, 32] })
        }),
        onEachFeature: (f, layer) => {
            let p = f.properties;
            let stars = '★'.repeat(Math.round(p.avg_rating)) + '☆'.repeat(5-Math.round(p.avg_rating));
            layer.bindPopup(`
                <div style="width:180px">
                    ${p.image_url ? `<img src="${p.image_url}" style="width:100%; height:90px; object-fit:cover; border-radius:8px; margin-bottom:5px;">` : ''}
                    <h6 class="fw-bold mb-1">${p.name}</h6>
                    <div class="text-warning small mb-1">${stars} (${p.avg_rating})</div>
                    <div class="text-muted small mb-2"><i class="fa-regular fa-clock"></i> ${p.open_time} - ${p.close_time}</div>
                    <a href="/location/${p.pk}/" class="btn btn-primary btn-sm w-100 rounded-pill text-white">Xem chi tiết</a>
                </div>
            `);
        }
    }).addTo(map);

    // Tự động load tất cả địa điểm khi mới vào trang (đợi 0.5s để bản đồ khởi tạo xong)
    setTimeout(() => {
        setInfiniteRadius();
    }, 500);

</script>
{% endblock %}
