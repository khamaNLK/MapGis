{% extends 'locations/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow border-danger mx-auto" style="max-width: 500px;">
        <div class="card-header bg-danger text-white fw-bold">
            ⚠️ Xác nhận xóa
        </div>
        <div class="card-body text-center">
            <h5 class="card-title">Bạn có chắc muốn xóa địa điểm này?</h5>
            <p class="card-text fw-bold text-primary">"{{ location.name }}"</p>
            <p class="text-muted small">Hành động này không thể hoàn tác!</p>
            
            <form method="POST">
                {% csrf_token %}
                <a href="{% url 'location_detail' location.pk %}" class="btn btn-secondary">Hủy bỏ</a>
                <button type="submit" class="btn btn-danger">Xóa ngay</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
