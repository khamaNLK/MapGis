{% extends 'locations/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên đăng nhập</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mật khẩu</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary fw-bold">Đăng Nhập</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    Chưa có tài khoản? <a href="{% url 'signup' %}">Đăng ký mới</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
